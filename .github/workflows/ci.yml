name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest

  csharp:
    name: C# (build + format + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SwiftSend.sln

      - name: Format (analyzers)
        run: dotnet format analyzers SwiftSend.sln --verify-no-changes

      - name: Build
        run: dotnet build SwiftSend.sln -c Release --no-restore

      - name: Test
        run: dotnet test SwiftSend.sln -c Release --no-build --verbosity normal

  shared:
    name: Shared UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required templates and static assets
        run: |
          set -euo pipefail
          for f in \
            shared/templates/dashboard.html \
            shared/templates/home.html \
            shared/templates/browse.html \
            shared/templates/upload.html \
            shared/templates/manager.html \
            shared/static/css/app.css \
            shared/static/js/upload.js \
            shared/static/js/manager.js \
            shared/static/icon.png
          do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done

      - name: Route parity (Python ↔ C#)
        run: |
          set -euo pipefail
          routes=(
            '"/"'
            '"/browse"'
            '"/upload"'
            '"/api/upload"'
            '"/upload_manager"'
            '"/public_manager"'
            '"/api/host/open"'
            '"/api/host/delete"'
            '"/api/host/rename"'
            '"/api/host/upload"'
          )
          for route in "${routes[@]}"; do
            grep -qF "$route" python/main.py || { echo "Missing in Python: $route"; exit 1; }
            grep -qF "$route" csharp/SwiftSend/WebServer.cs || { echo "Missing in C#: $route"; exit 1; }
          done
          grep -qE 'download' python/main.py
          grep -qE 'download' csharp/SwiftSend/WebServer.cs
          grep -qF '16 * 1024 * 1024 * 1024' python/main.py
          grep -qF '16L * 1024 * 1024 * 1024' csharp/SwiftSend/WebServer.cs
