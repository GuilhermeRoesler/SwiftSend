name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: PyInstaller (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-amd64
            binary: SwiftSend.exe
            asset_ext: .exe
          - os: ubuntu-latest
            id: linux-amd64
            binary: SwiftSend
            asset_ext: ""
          - os: macos-latest
            id: macos-arm64
            binary: SwiftSend
            asset_ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps (pywebview / GTK)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            libgirepository-2.0-dev \
            libcairo2-dev \
            pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install PyGObject
          fi
        shell: bash

      - name: Build
        run: python build.py

      - name: Package artifact
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="dev"
          fi
          id="${{ matrix.id }}"
          mkdir -p ../release-out
          src="dist/${{ matrix.binary }}"
          test -f "$src"
          chmod +x "$src" || true
          dest="../release-out/SwiftSend-python-${id}-${tag}${{ matrix.asset_ext }}"
          cp "$src" "$dest"
          ls -la ../release-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-python-${{ matrix.id }}
          path: release-out/SwiftSend-python-${{ matrix.id }}-*
          if-no-files-found: error

  windows-installer:
    name: Inno Setup (Windows)
    needs: [python]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Python Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-python-windows-amd64
          path: release-in

      - name: Stage SwiftSend.exe for Inno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python/dist | Out-Null
          $src = Get-ChildItem -Path release-in -Filter "SwiftSend-python-windows-amd64-*" -File |
            Select-Object -First 1
          if (-not $src) { throw "Artifact exe not found in release-in" }
          Copy-Item $src.FullName python/dist/SwiftSend.exe -Force
          Get-Item python/dist/SwiftSend.exe | Format-List Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $version = if ($tag -match '^v(.+)$') { $Matches[1] } else { $tag }
          .\installer\build_installer.ps1 -Version $version -SkipBuild

      - name: Package artifact
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $version = if ($tag -match '^v(.+)$') { $Matches[1] } else { $tag }
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          $src = "installer/output/SwiftSend-Setup-$version.exe"
          if (-not (Test-Path $src)) { throw "Missing $src" }
          Copy-Item $src "release-out/SwiftSend-Setup-$tag.exe" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-Setup-windows
          path: release-out/SwiftSend-Setup-*.exe
          if-no-files-found: error

  linux-installer:
    name: AppImage (Linux)
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Python Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-python-linux-amd64
          path: release-in

      - name: Stage binary
        run: |
          mkdir -p python/dist
          src="$(find release-in -type f -name 'SwiftSend-python-linux-amd64-*' | head -n1)"
          test -n "$src"
          cp "$src" python/dist/SwiftSend
          chmod +x python/dist/SwiftSend

      - name: Build AppImage
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="dev"
          fi
          version="${tag#v}"
          chmod +x installer/linux/build_appimage.sh
          ./installer/linux/build_appimage.sh "$version" --skip-build
          mkdir -p release-out
          src="installer/output/SwiftSend-${version}-x86_64.AppImage"
          test -f "$src"
          cp "$src" "release-out/SwiftSend-${tag}-linux-amd64.AppImage"
          chmod +x "release-out/SwiftSend-${tag}-linux-amd64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-AppImage-linux
          path: release-out/SwiftSend-*-linux-amd64.AppImage
          if-no-files-found: error

  macos-installer:
    name: DMG (macOS)
    needs: [python]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Python macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-python-macos-arm64
          path: release-in

      - name: Stage binary
        run: |
          mkdir -p python/dist
          src="$(find release-in -type f -name 'SwiftSend-python-macos-arm64-*' | head -n1)"
          test -n "$src"
          cp "$src" python/dist/SwiftSend
          chmod +x python/dist/SwiftSend

      - name: Build DMG
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="dev"
          fi
          version="${tag#v}"
          chmod +x installer/macos/build_dmg.sh
          ./installer/macos/build_dmg.sh "$version" --skip-build
          mkdir -p release-out
          src="installer/output/SwiftSend-${version}-macos-arm64.dmg"
          test -f "$src"
          cp "$src" "release-out/SwiftSend-${tag}-macos-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-DMG-macos
          path: release-out/SwiftSend-*-macos-arm64.dmg
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [python, windows-installer, linux-installer, macos-installer]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SwiftSend-python-*
          path: dist
          merge-multiple: true

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-Setup-windows
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-AppImage-linux
          path: dist

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: SwiftSend-DMG-macos
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SwiftSend ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/SwiftSend-Setup-*.exe
            dist/SwiftSend-*-linux-amd64.AppImage
            dist/SwiftSend-*-macos-arm64.dmg
            dist/SwiftSend-python-*
          body: |
            ## Instaladores (recomendado)

            | Artefato | Plataforma |
            |----------|------------|
            | `SwiftSend-Setup-${{ github.ref_name }}.exe` | Windows x64 (Inno Setup) |
            | `SwiftSend-${{ github.ref_name }}-linux-amd64.AppImage` | Linux x64 (AppImage) |
            | `SwiftSend-${{ github.ref_name }}-macos-arm64.dmg` | macOS Apple Silicon (DMG) |

            Dados do usuário (todos os SOs): `Documentos/SwiftSend` (`arquivos_publicos` / `arquivos_recebidos`).

            - **Windows:** Menu Iniciar + desinstalador; se o WebView2 Runtime estiver ausente, o setup tenta instalá-lo.
            - **Linux:** `chmod +x` no AppImage e execute. Requer GTK 3 + WebKitGTK (ex.: `libgtk-3-0`, `libwebkit2gtk-4.1-0` no Debian/Ubuntu).
            - **macOS:** abra o DMG e arraste `SwiftSend.app` para Aplicativos.

            ## Python (portable)

            | Artefato | Plataforma |
            |----------|------------|
            | `SwiftSend-python-windows-amd64-${{ github.ref_name }}.exe` | Windows x64 |
            | `SwiftSend-python-linux-amd64-${{ github.ref_name }}` | Linux x64 |
            | `SwiftSend-python-macos-arm64-${{ github.ref_name }}` | macOS arm64 |

            Builds **C#** (FDD/SCD/R2R) não entram no release — use `csharp\publish.bat` localmente (devs).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
