name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: PyInstaller (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-amd64
            binary: SwiftSend.exe
            asset_ext: .exe
          - os: ubuntu-latest
            id: linux-amd64
            binary: SwiftSend
            asset_ext: ""
          - os: macos-latest
            id: macos-arm64
            binary: SwiftSend
            asset_ext: ""
          - os: macos-13
            id: macos-amd64
            binary: SwiftSend
            asset_ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps (pywebview / GTK)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.1-0 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install PyGObject
          fi
        shell: bash

      - name: Build
        run: python build.py

      - name: Package artifact
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="dev"
          fi
          id="${{ matrix.id }}"
          mkdir -p ../release-out
          src="dist/${{ matrix.binary }}"
          test -f "$src"
          chmod +x "$src" || true
          dest="../release-out/SwiftSend-python-${id}-${tag}${{ matrix.asset_ext }}"
          cp "$src" "$dest"
          ls -la ../release-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-python-${{ matrix.id }}
          path: release-out/SwiftSend-python-${{ matrix.id }}-*
          if-no-files-found: error

  csharp-windows:
    name: C# ${{ matrix.label }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fdd
            label: Framework-Dependent
            profile: FrameworkDependent
            out_dir: csharp/dist/fdd
          - id: scd
            label: Self-Contained
            profile: SelfContained
            out_dir: csharp/dist/scd
          - id: r2r
            label: ReadyToRun
            profile: ReadyToRun
            out_dir: csharp/dist/r2r
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish ${{ matrix.label }}
        run: >
          dotnet publish csharp/SwiftSend/SwiftSend.csproj
          -c Release
          -p:PublishProfile=${{ matrix.profile }}

      - name: Package artifact
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $id = "${{ matrix.id }}"
          $src = "${{ matrix.out_dir }}"
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          # WebView2 deixa DLLs nativas ao lado do .exe — zip da pasta publish.
          Get-ChildItem $src -Include *.pdb,*.xml -Recurse -File | Remove-Item -Force
          Compress-Archive -Path "$src\*" -DestinationPath "release-out/SwiftSend-csharp-windows-$id-$tag.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-csharp-windows-${{ matrix.id }}
          path: release-out/SwiftSend-csharp-windows-*.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [python, csharp-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SwiftSend-python-*
          path: dist
          merge-multiple: true

      - name: Download C# artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SwiftSend-csharp-windows-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SwiftSend ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/SwiftSend-python-*
            dist/SwiftSend-csharp-windows-*.zip
          body: |
            ## Python (multiplataforma)

            | Artefato | Plataforma |
            |----------|------------|
            | `SwiftSend-python-windows-amd64-${{ github.ref_name }}.exe` | Windows x64 |
            | `SwiftSend-python-linux-amd64-${{ github.ref_name }}` | Linux x64 |
            | `SwiftSend-python-macos-arm64-${{ github.ref_name }}` | macOS Apple Silicon |
            | `SwiftSend-python-macos-amd64-${{ github.ref_name }}` | macOS Intel |

            No Linux/macOS: `chmod +x` no binário antes de executar. Linux precisa de GTK 3 + WebKitGTK (ex.: `libgtk-3-0`, `libwebkit2gtk-4.1-0` no Debian/Ubuntu).

            ## C# (Windows)

            | Artefato | Descrição |
            |----------|-----------|
            | `SwiftSend-csharp-windows-fdd-${{ github.ref_name }}.zip` | Framework-Dependent — exige [.NET 8 Desktop](https://dotnet.microsoft.com/download/dotnet/8.0) + ASP.NET Core Runtime |
            | `SwiftSend-csharp-windows-scd-${{ github.ref_name }}.zip` | Self-Contained — inclui o runtime .NET |
            | `SwiftSend-csharp-windows-r2r-${{ github.ref_name }}.zip` | Self-Contained + ReadyToRun — startup mais rápido |

            Extraia o zip C# e execute `SwiftSend.exe`. Builds C# exigem [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/).
            Native AOT não está disponível: WPF não é compatível com `PublishAot` (NETSDK1168).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
