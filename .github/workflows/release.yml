name: Release build (optional)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-windows:
    name: PyInstaller (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-python-windows
          path: python/dist/SwiftSend.exe
          if-no-files-found: error

  csharp-windows:
    name: Publish single-file (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish csharp/SwiftSend/SwiftSend.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o csharp/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-csharp-windows
          path: csharp/dist/
          if-no-files-found: error
