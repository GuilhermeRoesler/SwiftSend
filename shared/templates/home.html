<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftSend</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="/static/icon.png" type="image/png">
</head>
<body class="flex flex-col h-screen">
    <header class="site-header">
        <a class="brand-mark" href="/">
            <img src="/static/icon.png" width="32" height="32" alt="">
            <span class="brand-name">SwiftSend</span>
        </a>
        <span class="live-pill">
            <span class="live-dot" aria-hidden="true"></span>
            Rede local
        </span>
    </header>

    <main class="flex-1 overflow-auto">
        <div class="home-shell page-enter">
            <div class="home-hero">
                <div class="brand-lockup">
                    <img src="/static/icon.png" width="52" height="52" alt="">
                    <span class="text-xl font-bold tracking-tight">SwiftSend</span>
                </div>
                <h2>Compartilhamento Local</h2>
                <p>Arquivos pesados na mesma rede Wi‑Fi — direto entre dispositivos, sem nuvem.</p>
            </div>

            <div class="action-stack">
                <a href="/browse" class="action-primary">
                    <span class="action-icon" aria-hidden="true">
                        <span class="material-symbols-outlined text-3xl">download</span>
                    </span>
                    <span class="action-copy">
                        <strong>Baixar arquivos</strong>
                        <span>Ver o que o host disponibilizou</span>
                    </span>
                    <span class="material-symbols-outlined action-chevron" aria-hidden="true">arrow_forward</span>
                </a>

                <a href="/upload" class="action-secondary">
                    <span class="action-icon" aria-hidden="true">
                        <span class="material-symbols-outlined text-3xl">upload</span>
                    </span>
                    <span class="action-copy">
                        <strong>Enviar arquivos</strong>
                        <span>Mandar arquivos grandes para o host</span>
                    </span>
                    <span class="material-symbols-outlined action-chevron" aria-hidden="true">arrow_forward</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
