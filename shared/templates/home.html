<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftSend</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="/static/icon.png" type="image/png">
</head>
<body class="page-home flex flex-col h-screen">
    <header class="site-header site-header--minimal">
        <span class="live-pill">
            <span class="live-dot" aria-hidden="true"></span>
            Rede local
        </span>
    </header>

    <main class="flex-1 overflow-auto">
        <div class="home-stage page-enter">
            <div class="lan-scene" aria-hidden="true">
                <div class="lan-device lan-device--host">
                    <span class="lan-device-screen"></span>
                </div>
                <div class="lan-beam">
                    <span class="lan-packet"></span>
                    <span class="lan-packet lan-packet--delay"></span>
                    <span class="lan-packet lan-packet--delay2"></span>
                </div>
                <div class="lan-device lan-device--phone">
                    <span class="lan-device-screen"></span>
                </div>
            </div>

            <p class="home-kicker">Transferência na LAN</p>
            <h1 class="brand-hero">SwiftSend</h1>
            <p class="home-tagline">Arquivos pesados no mesmo Wi‑Fi — direto entre dispositivos, sem nuvem.</p>

            <div class="action-stack">
                <a href="/browse" class="action-primary">
                    <span class="action-icon" aria-hidden="true">
                        <span class="material-symbols-outlined text-3xl">download</span>
                    </span>
                    <span class="action-copy">
                        <strong>Baixar arquivos</strong>
                        <span>Ver o que o host disponibilizou</span>
                    </span>
                    <span class="material-symbols-outlined action-chevron" aria-hidden="true">arrow_forward</span>
                </a>

                <a href="/upload" class="action-secondary">
                    <span class="action-icon" aria-hidden="true">
                        <span class="material-symbols-outlined text-3xl">upload</span>
                    </span>
                    <span class="action-copy">
                        <strong>Enviar arquivos</strong>
                        <span>Mandar arquivos grandes para o host</span>
                    </span>
                    <span class="material-symbols-outlined action-chevron" aria-hidden="true">arrow_forward</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
